name: Unzip upload

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace repo contents with the uploaded zips
        run: |
          shopt -s nullglob
          zips=(*.zip)
          [ ${#zips[@]} -eq 0 ] && { echo "No zips"; exit 0; }
          mkdir /tmp/z && mv "${zips[@]}" /tmp/z/
          git ls-files | grep -v '^\.github/' | xargs -r git rm -q --
          for z in /tmp/z/*.zip; do unzip -o -q "$z" -d .; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restructure repo from uploaded zips" || echo "Nothing to commit"
          git push
